# Configuration sshd du nœud : clé publique uniquement, pas de mot de passe,
# pas de root. Le contrôleur est le seul client attendu.
Port 22
Protocol 2
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
AllowUsers insacloud
X11Forwarding no
AllowTcpForwarding no
PrintMotd no
Subsystem sftp /usr/lib/ssh/sftp-server
