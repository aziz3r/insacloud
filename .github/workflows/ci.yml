# =============================================================================
#  .github/workflows/ci.yml - Intégration continue d'InsaCloud
# -----------------------------------------------------------------------------
#  Chaque envoi de code déclenche la même chaîne de contrôles que celle que l'on
#  peut rejouer sur son poste. Aucun contrôle n'a besoin d'un accès aux machines
#  de production : Docker est simulé dans les tests, et le secret Ansible Vault
#  n'est pas nécessaire pour analyser les rôles.
#
#  Les sept travaux correspondent aux familles d'analyse vues en cours :
#    lint            style et erreurs réelles du code (ruff, ansible-lint, hadolint)
#    tests           tests unitaires et d'intégration (pytest) + couverture
#    SAST            analyse statique de sécurité du code source (bandit)
#    SCA             analyse de composition logicielle : CVE des dépendances (pip-audit)
#    secrets         recherche de secrets commis par erreur (gitleaks)
#    image scanning  CVE des paquets présents dans l'image Docker (Trivy)
#    DAST            analyse de l'application EN FONCTIONNEMENT (tests/dast.sh, nuclei)
#    build           construction et publication des images, versionnées
#    SBOM            inventaire des composants livrés (Syft)
#    integration     la pile complète démarre et fonctionne (docker compose)
#    deploy          déploiement par Ansible vers l'hôte de production
# =============================================================================

name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # exécution manuelle depuis l'onglet Actions

# Principe du moindre privilège : le jeton du workflow n'a besoin que de lire.
permissions:
  contents: read
  packages: write        # publication des images dans le registre GitHub

# Un nouvel envoi annule l'exécution précédente encore en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version de Python de la cible réelle (Ubuntu 22.04, box Vagrant du projet).
  PYTHON_VERSION: "3.10"

jobs:
  # ---------------------------------------------------------------------------
  #  1. Style et erreurs réelles du code Python
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 2_webapp/requirements-dev.txt

      - name: Installer l'outillage
        run: pip install --quiet -r 2_webapp/requirements-dev.txt

      - name: Analyser le code (style, imports morts, noms inconnus, motifs dangereux)
        working-directory: 2_webapp
        run: ruff check . --output-format=github

      - name: Vérifier la syntaxe shell de la chaîne elle-même
        # Une erreur de syntaxe dans un bloc « run: » ne se voit sinon qu'au
        # moment où l'étape s'exécute, parfois au bout de dix minutes. Deux
        # guillemets déséquilibrées ont fait échouer deux exécutions de suite.
        run: |
          pip install --quiet pyyaml
          python3 .github/verifier-workflow.py

      - name: Vérifier que les schémas du README sont à jour
        # Les SVG de docs/ sont engendrés par docs/schemas/. Un schéma qui
        # vieillit pendant que le projet avance ne se voit nulle part dans le
        # code : on régénère ici, et on refuse la moindre différence.
        run: |
          python3 docs/schemas/tout.py
          git diff --exit-code -- docs/*.svg

  # ---------------------------------------------------------------------------
  #  2. Tests unitaires et d'intégration
  # ---------------------------------------------------------------------------
  tests-python:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 2_webapp/requirements-dev.txt

      - name: Installer l'application et l'outillage
        run: pip install --quiet -r 2_webapp/requirements-dev.txt

      - name: Exécuter la suite de tests
        working-directory: 2_webapp
        # Les tests remplacent Docker par des fonctions espions : ils vérifient la
        # commande construite (docker run -d --restart=always -p <port>:22 ...) et
        # le comportement du Faucheur sans lancer le moindre conteneur.
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-python
          path: 2_webapp/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  #  3. SAST - analyse statique de sécurité du code source
  # ---------------------------------------------------------------------------
  sast-python:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 2_webapp/requirements-dev.txt

      - name: Installer l'outillage
        run: pip install --quiet -r 2_webapp/requirements-dev.txt

      - name: Rechercher les motifs dangereux (injection, secrets, appels système)
        working-directory: 2_webapp
        # Aucune règle n'est désactivée globalement : les rares cas légitimes
        # portent une annotation « # nosec <règle> » justifiée à la ligne même.
        run: bandit -c pyproject.toml -r . --severity-level low --confidence-level low

  # ---------------------------------------------------------------------------
  #  4. SCA - vulnérabilités connues des dépendances
  # ---------------------------------------------------------------------------
  sca-dependances:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer pip-audit
        run: pip install --quiet pip-audit

      - name: Confronter les versions épinglées aux bases de CVE
        # requirements.txt fige chaque version : l'audit sait donc exactement
        # quoi vérifier, et une CVE publiée fera échouer la chaîne au prochain envoi.
        run: pip-audit --strict --requirement 2_webapp/requirements.txt

  # ---------------------------------------------------------------------------
  #  5. Recherche de secrets commis par erreur
  # ---------------------------------------------------------------------------
  secrets:
    name: Fuite de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tout l'historique : un secret supprimé y reste présent

      - name: Rechercher clés, jetons et mots de passe dans l'historique
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
                   --redact --no-banner --verbose

  # ---------------------------------------------------------------------------
  #  6. DAST - analyse de l'application en fonctionnement
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (application en fonctionnement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 2_webapp/requirements.txt

      - name: Installer l'application
        run: pip install --quiet -r 2_webapp/requirements.txt

      - name: Démarrer l'application avec Gunicorn
        working-directory: 2_webapp
        env:
          # Base et clés jetables, créées pour la durée du travail : aucun
          # secret du dépôt n'est nécessaire pour analyser le service.
          INSACLOUD_DB: /tmp/dast.db
          INSACLOUD_SECRET_KEY: cle-de-session-jetable-pour-l-analyse
        run: |
          export INSACLOUD_VAULT_KEY="$(python -c \
            'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          # --preload comme en production : le schéma est créé une seule fois,
          # avant le fork des workers.
          gunicorn --workers 2 --preload --bind 127.0.0.1:5000 --chdir . app:app &
          for essai in $(seq 1 30); do
            nc -z 127.0.0.1 5000 && break || sleep 1
          done
          nc -z 127.0.0.1 5000 || { echo "L'application n'a pas démarré." >&2; exit 1; }

      - name: Contrôles dynamiques (en-têtes, pages protégées, CSRF, cookies)
        working-directory: 2_webapp
        run: ./tests/dast.sh http://127.0.0.1:5000

      - name: Analyse générique avec nuclei
        # Complète les contrôles ciblés ci-dessus par une batterie de sondes
        # génériques (mauvaises configurations, fichiers exposés, en-têtes).
        run: |
          docker run --rm --network host projectdiscovery/nuclei:latest \
            -u http://127.0.0.1:5000/login \
            -tags http,misconfig,exposure -severity medium,high,critical \
            -silent -nc -timeout 8 | tee /tmp/nuclei.txt
          if [ -s /tmp/nuclei.txt ]; then
            echo "nuclei signale des points à corriger (voir ci-dessus)." >&2
            exit 1
          fi
          echo "nuclei : aucune alerte de gravité moyenne ou supérieure."

  # ---------------------------------------------------------------------------
  #  7. Qualité de l'infrastructure as code
  # ---------------------------------------------------------------------------
  lint-ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Ansible et son analyseur
        run: pip install --quiet ansible-core ansible-lint

      - name: Installer les collections requises
        working-directory: 3_ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Vérifier la syntaxe du playbook
        working-directory: 3_ansible
        # Le fichier group_vars/insacloud/vault.yml est chiffré : Ansible signale
        # simplement qu'il ne peut pas le lire, ce qui n'empêche ni l'analyse
        # syntaxique ni le lint. Le secret du Vault n'a donc pas à être exposé ici.
        run: ansible-playbook site.yml --syntax-check

      - name: Analyser les rôles (profil « production »)
        working-directory: 3_ansible
        run: ansible-lint

      - name: Contrôler l'inventaire dynamique
        working-directory: 3_ansible
        run: |
          pip install --quiet ruff bandit
          ruff check inventaire_vagrant.py --select E,F,W,B,S,UP \
               --line-length 110 --target-version py310
          bandit -q inventaire_vagrant.py
          # Sans Vagrant installé, le script doit refuser proprement et expliquer
          # comment retomber sur l'inventaire statique (code de sortie 1).
          if ./inventaire_vagrant.py --list; then
            echo "Le script aurait dû échouer en l'absence de Vagrant." >&2; exit 1
          fi
          ./inventaire_vagrant.py --list 2>&1 | grep -q "inventaire statique"
          echo "Inventaire dynamique : repli documenté vérifié."

  # ---------------------------------------------------------------------------
  #  8. Images des machines louées : lint, construction et scan de CVE
  # ---------------------------------------------------------------------------
  images-docker:
    name: Images Docker (hadolint + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyser les quatre Dockerfiles
        run: |
          for fichier in 1_docker/Dockerfile 1_docker/debian.Dockerfile \
                         1_docker/alpine.Dockerfile 2_webapp/Dockerfile; do
            echo "::group::hadolint $fichier"
            docker run --rm -i -v "$PWD/1_docker/.hadolint.yaml:/.hadolint.yaml:ro" \
              hadolint/hadolint:latest-alpine \
              hadolint --config /.hadolint.yaml - < "$fichier"
            echo "::endgroup::"
          done

      - name: Vérifier le fichier docker compose
        # Les secrets sont obligatoires (« :? ») : on en fournit de factices,
        # le temps de valider la syntaxe et la résolution des variables.
        env:
          POSTGRES_PASSWORD: validation-syntaxe
          INSACLOUD_SECRET_KEY: validation-syntaxe
          INSACLOUD_VAULT_KEY: validation-syntaxe
        run: |
          docker compose config --quiet
          docker compose --profile build --profile demo config --quiet
          echo "Services : $(docker compose config --services | tr '\n' ' ')"

      - name: Construire l'image légère (celle du mode démonstration)
        working-directory: 1_docker
        run: docker build -t insacloud_alpine:latest -f alpine.Dockerfile .

      - name: Construire l'image de la plateforme
        working-directory: 2_webapp
        run: docker build -t insacloud_web:latest .

      - name: Vérifier que la plateforme tourne sans privilège
        # Exigence explicite du cahier des charges : « utilisateur non-root
        # dans le conteneur ». Une régression ici doit arrêter la chaîne.
        run: |
          utilisateur=$(docker run --rm insacloud_web:latest id -u)
          if [ "$utilisateur" = "0" ]; then
            echo "L'image de la plateforme tourne en root." >&2; exit 1
          fi
          echo "Plateforme exécutée sous l'uid $utilisateur (non root)."

      - name: Vérifier qu'aucun mot de passe n'est inscrit dans l'image
        # Régression déjà rencontrée : un ENV ROOT_PASSWORD serait lisible par
        # quiconque exécute `docker inspect` sur l'image publiée.
        run: |
          if docker inspect insacloud_alpine:latest \
               --format '{{json .Config.Env}}' | grep -qi 'password\|passwd'; then
            echo "Un mot de passe figure dans les variables d'environnement de l'image." >&2
            exit 1
          fi
          echo "Aucun mot de passe dans l'image."

      - name: Vérifier que la machine démarre et que SSH répond
        run: |
          # Mot de passe tiré au hasard à chaque exécution : aucune valeur
          # constante n'est inscrite dans le dépôt (le travail « gitleaks »
          # ci-dessus refuserait d'ailleurs un mot de passe en dur ici).
          MDP="$(tr -dc 'A-Za-z2-9' < /dev/urandom | head -c 16)"
          docker run -d --name machine-test --restart=always \
            -p 2222:22 -e ROOT_PASSWORD="$MDP" insacloud_alpine:latest
          for essai in $(seq 1 30); do
            if nc -z 127.0.0.1 2222; then echo "SSH écoute (essai $essai)"; break; fi
            sleep 1
          done
          nc -z 127.0.0.1 2222 || { docker logs machine-test; exit 1; }
          docker rm -f machine-test

      - name: Inventorier toutes les failles connues (sans bloquer)
        # Rapport complet, failles sans correctif comprises : rien n'est caché,
        # même ce sur quoi on ne peut pas agir aujourd'hui.
        run: |
          for image in insacloud_alpine:latest insacloud_web:latest; do
            echo "::group::Trivy — $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners vuln \
              --severity HIGH,CRITICAL --no-progress "$image" || true
            echo "::endgroup::"
          done

      - name: Refuser une faille corrigeable
        # --ignore-unfixed : le verrou ne bloque que sur ce qu'on peut
        # réellement corriger. Échouer sur une faille sans correctif publié
        # rendrait la chaîne rouge en permanence, et apprendrait à l'ignorer.
        run: |
          for image in insacloud_alpine:latest insacloud_web:latest; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --no-progress "$image"
          done
          echo "Aucune faille corrigeable dans les images."

  # ---------------------------------------------------------------------------
  #  9. Intégration : la pile complète démarre et fonctionne
  # ---------------------------------------------------------------------------
  integration:
    name: Intégration (pile compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les secrets de la pile
        # Secrets jetables, valables le temps du travail. La pile refuse de
        # démarrer sans eux : c'est précisément ce qu'on veut vérifier.
        run: |
          python -c "import secrets; print(f'POSTGRES_PASSWORD={secrets.token_urlsafe(24)}')" >> .env
          python -c "import secrets; print(f'INSACLOUD_SECRET_KEY={secrets.token_hex(32)}')" >> .env
          pip install --quiet cryptography
          python -c "from cryptography.fernet import Fernet; print(f'INSACLOUD_VAULT_KEY={Fernet.generate_key().decode()}')" >> .env
          python -c "import secrets; print(f'INSACLOUD_AGENT_TOKEN={secrets.token_urlsafe(32)}')" >> .env
          {
            echo "INSACLOUD_BIND=127.0.0.1"
            echo "INSACLOUD_HTTP_PORT=8088"
            echo "INSACLOUD_CLUSTER=ci"
            echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)"
          } >> .env

      - name: Construire les images nécessaires
        run: |
          docker compose build web
          docker compose --profile build build image-alpine

      - name: Démarrer la pile
        run: |
          docker compose up -d
          for essai in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then
              echo "Pile prête après ${essai}0 s."; break
            fi
            sleep 10
          done
          curl -fsS http://127.0.0.1:8088/health

      - name: Exécuter les tests d'intégration
        # Tests 1 à 5 du cahier des charges. Le test 6 (panne d'un nœud) exige
        # un parc de plusieurs machines : il est joué sur le cluster Vagrant.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          ./2_webapp/tests/integration.sh http://127.0.0.1:8088

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail 80

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  #  10. Build et publication des images, avec leur inventaire de composants
  # ---------------------------------------------------------------------------
  publier-images:
    name: Build, SBOM et publication
    runs-on: ubuntu-latest
    # On ne publie que ce qui a franchi tous les contrôles précédents.
    needs: [lint-python, tests-python, sast-python, sca-dependances, secrets,
            dast, lint-ansible, images-docker, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Calculer les étiquettes de version
        id: version
        # Trois étiquettes : le numéro de version du dépôt, le commit exact
        # (traçabilité : on sait toujours quel code tourne), et « latest ».
        run: |
          version=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "registre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Version : ${version} — commit ${GITHUB_SHA::12}"

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et étiqueter les images
        env:
          REGISTRE: ${{ steps.version.outputs.registre }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          docker build -t "$REGISTRE/insacloud-web:$VERSION" \
                       -t "$REGISTRE/insacloud-web:$SHA" \
                       -t "$REGISTRE/insacloud-web:latest" 2_webapp
          docker build -f 1_docker/alpine.Dockerfile \
                       -t "$REGISTRE/insacloud-alpine:$VERSION" \
                       -t "$REGISTRE/insacloud-alpine:$SHA" \
                       -t "$REGISTRE/insacloud-alpine:latest" 1_docker

      - name: Inventorier les composants livrés (SBOM)
        env:
          REGISTRE: ${{ steps.version.outputs.registre }}
          VERSION: ${{ steps.version.outputs.version }}
        # Un SBOM dit exactement quels paquets contient l'image publiée : c'est
        # ce qui permet, le jour où une faille est annoncée, de répondre en
        # quelques secondes à « sommes-nous concernés ? ».
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/sortie" anchore/syft:latest \
            "$REGISTRE/insacloud-web:$VERSION" \
            -o spdx-json="/sortie/sbom-insacloud-web.json" \
            -o table
          echo "Composants inventoriés : $(grep -c '"name"' sbom-insacloud-web.json)"

      - name: Conserver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.json

      - name: Refuser la publication d'une image vulnérable
        env:
          REGISTRE: ${{ steps.version.outputs.registre }}
          VERSION: ${{ steps.version.outputs.version }}
        # Dernier verrou avant le registre : aucune image portant une faille
        # grave ET corrigeable ne doit en sortir. Les failles sans correctif
        # publié sont inventoriées par le travail précédent, pas bloquantes.
        run: |
          for image in insacloud-web insacloud-alpine; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --no-progress "$REGISTRE/$image:$VERSION"
          done

      - name: Publier les images
        env:
          REGISTRE: ${{ steps.version.outputs.registre }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          for image in insacloud-web insacloud-alpine; do
            for etiquette in "$VERSION" "$SHA" latest; do
              docker push "$REGISTRE/$image:$etiquette"
            done
          done
          echo "Images publiées sous $REGISTRE."

  # ---------------------------------------------------------------------------
  #  11. Déploiement vers l'hôte de production, par Ansible
  # ---------------------------------------------------------------------------
  deployer:
    name: Déploiement (Ansible)
    runs-on: ubuntu-latest
    needs: [publier-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la cible est configurée
        id: cible
        # Sans secrets de déploiement, l'étage s'annonce ignoré plutôt que de
        # faire croire à un déploiement qui n'a pas eu lieu.
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configuree=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun hôte de déploiement configuré (secret DEPLOY_HOST)."
            echo "Renseignez DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY et"
            echo "ANSIBLE_VAULT_PASSWORD dans les secrets du dépôt pour l'activer."
          else
            echo "configuree=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.cible.outputs.configuree == 'true'
        with:
          python-version: "3.12"

      - name: Installer Ansible
        if: steps.cible.outputs.configuree == 'true'
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r 3_ansible/requirements.yml

      - name: Préparer l'accès SSH et le secret du Vault
        if: steps.cible.outputs.configuree == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass

      - name: Déployer la nouvelle version
        if: steps.cible.outputs.configuree == 'true'
        working-directory: 3_ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        # deploy.yml ne touche qu'au contrôleur et interroge /health à la fin :
        # un déploiement qui ne sert pas fait échouer la chaîne.
        run: |
          cat > /tmp/cible.ini <<INI
          [controllers]
          production ansible_host=${{ secrets.DEPLOY_HOST }}
          [insacloud:children]
          controllers
          [insacloud:vars]
          ansible_user=${{ secrets.DEPLOY_USER }}
          ansible_become=true
          ansible_ssh_private_key_file=~/.ssh/id_deploiement
          INI
          ansible-playbook -i /tmp/cible.ini deploy.yml \
