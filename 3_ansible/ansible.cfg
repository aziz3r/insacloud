# =============================================================================
#  ansible.cfg - Configuration locale du projet (prise en compte automatiquement
#  quand ansible-playbook est lancé depuis ce dossier)
# =============================================================================
[defaults]
inventory            = inventaire.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
forks                = 5
# apt_repository est déprécié dans ansible-core >= 2.19 au profit de deb822_repository,
# mais reste le seul module disponible sur les versions plus anciennes : on masque l'avertissement.
deprecation_warnings = False

# Pour ne plus taper le mot de passe du Vault à chaque exécution, créez un
# fichier .vault_pass (chmod 600, ignoré par git) contenant le mot de passe,
# puis décommentez la ligne suivante :
# vault_password_file = .vault_pass

[privilege_escalation]
become        = True
become_method = sudo
