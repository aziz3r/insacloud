# =============================================================================
#  inventaire.ini - Inventaire Ansible d'InsaCloud
# -----------------------------------------------------------------------------
#  Cible : une VM Ubuntu locale (VirtualBox / Vagrant / UTM / Multipass)
#  joignable sur le réseau privé hôte-VM à l'adresse 192.168.56.10.
#
#  Pré-requis côté VM :
#    - Ubuntu 22.04 / 24.04 avec python3 (présent par défaut)
#    - un utilisateur sudo (ici "vagrant") joignable en SSH par clé :
#          ssh-copy-id vagrant@192.168.56.10
#
#  Test de connectivité :
#          ansible -i inventaire.ini insacloud -m ping
#  Déploiement :
#          ansible-playbook -i inventaire.ini site.yml
# =============================================================================

[insacloud]
vm-insacloud ansible_host=192.168.56.10

[insacloud:vars]
# Utilisateur SSH disposant de sudo sur la VM
ansible_user=vagrant

# Élévation de privilèges (sudo) pour installer les paquets / services
ansible_become=true
ansible_become_method=sudo

# Interpréteur Python de la VM
ansible_python_interpreter=/usr/bin/python3

# Évite le blocage "host key" lors du premier contact avec la VM
ansible_ssh_common_args=-o StrictHostKeyChecking=no

# --- Authentification : choisir UNE des deux options ---------------------
# Option A (recommandée avec Vagrant) : clé privée générée par `vagrant up`.
#   Le chemin dépend du fournisseur : virtualbox ou vmware_desktop.
ansible_ssh_private_key_file=../.vagrant/machines/insacloud/virtualbox/private_key
# ansible_ssh_private_key_file=../.vagrant/machines/insacloud/vmware_desktop/private_key
#
# Option A bis : VM créée à la main -> ssh-copy-id vagrant@192.168.56.10
#   puis commentez la ligne ansible_ssh_private_key_file ci-dessus.
#
# Option B : mot de passe (nécessite `sshpass` sur la machine de contrôle).
# ansible_password=vagrant
# ansible_become_password=vagrant
