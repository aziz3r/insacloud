# =============================================================================
#  inventaire.ini - Inventaire Ansible d'InsaCloud (1 contrôleur + 2 workers)
# -----------------------------------------------------------------------------
#  VM créées par `vagrant up` (voir Vagrantfile) :
#    controller  192.168.56.10   site web, nginx, Faucheur, watchdog
#    worker1     192.168.56.11   Docker : machines louées
#    worker2     192.168.56.12   Docker : machines louées
#
#  Un seul hôte ? Mettez le contrôleur seul (groupe [workers] vide) :
#  les conteneurs tourneront alors sur le contrôleur (mode local).
#
#  Test :      ansible -m ping insacloud
#  Déployer :  ansible-playbook site.yml --ask-vault-pass
#
#  Variante dynamique : inventaire_vagrant.py interroge `vagrant ssh-config`
#  et découvre adresses, ports, provider et clés sans rien écrire en dur.
# =============================================================================

[controllers]
controller ansible_host=192.168.56.10

[workers]
worker1 ansible_host=192.168.56.11
worker2 ansible_host=192.168.56.12

[insacloud:children]
controllers
workers

[insacloud:vars]
ansible_user=vagrant
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no
# Clé privée générée par Vagrant. Le dossier porte le nom du provider : adaptez
# vagrant_provider ci-dessous (virtualbox | vmware_desktop | parallels | qemu),
# ou utilisez l'inventaire dynamique qui le découvre tout seul :
#     ansible-playbook -i inventaire_vagrant.py site.yml --ask-vault-pass
vagrant_provider=virtualbox
ansible_ssh_private_key_file=../.vagrant/machines/{{ inventory_hostname }}/{{ vagrant_provider }}/private_key
# VM créées à la main : commentez la ligne ci-dessus après `ssh-copy-id vagrant@<ip>`
