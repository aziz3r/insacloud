---
# =============================================================================
#  site.yml - Point d'entrée du déploiement InsaCloud
# -----------------------------------------------------------------------------
#  Ce playbook ne contient plus de tâches : il compose des RÔLES réutilisables.
#
#    roles/security_hardening : pare-feu UFW (SSH limité, 80/443, 8000-9000)
#    roles/docker             : installe Docker Engine (dépôt officiel, idempotent)
#    roles/reverse_proxy      : nginx en HTTPS (certificat, HSTS, rate-limit)
#    roles/webapp             : Python + Flask + Gunicorn, code, images Docker,
#                               services systemd (web + faucheur), secrets via Vault
#
#  Pré-requis : ansible-galaxy collection install -r requirements.yml
#
#  Variables : group_vars/insacloud/vars.yml   (claires)
#              group_vars/insacloud/vault.yml  (chiffrées avec ansible-vault)
#
#  Lancement :
#    ansible-playbook site.yml --ask-vault-pass
#  Simulation :
#    ansible-playbook site.yml --ask-vault-pass --check --diff
#  Un seul rôle :
#    ansible-playbook site.yml --ask-vault-pass --tags webapp
# =============================================================================

- name: Déployer la plateforme InsaCloud
  hosts: insacloud
  become: true

  roles:
    # 1. Pare-feu d'abord : `ufw enable` recharge iptables, il doit passer
    #    avant que Docker n'installe ses propres chaînes.
    - role: security_hardening
      tags: [security]
    # 2. Moteur de conteneurs
    - role: docker
      tags: [docker]
    # 3. Frontal TLS : nginx + certificat (partagé avec les machines louées)
    - role: reverse_proxy
      tags: [proxy]
    # 4. Application (Flask/Gunicorn sur 127.0.0.1, images, services, secrets)
    - role: webapp
      tags: [webapp]
