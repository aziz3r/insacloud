---
# =============================================================================
#  site.yml - Déploiement InsaCloud : 1 contrôleur + N workers
# -----------------------------------------------------------------------------
#  Rôles :
#    security_hardening  pare-feu UFW (ports selon le groupe)          tous
#    controller_key      compte de service + clé SSH de pilotage        contrôleur
#    docker              Docker Engine (workers) / client seul (ctrl)   tous
#    tls_cert            certificat auto-signé propre au nœud           tous
#    worker              accès SSH restreint du contrôleur, groupe docker  workers
#    docker_images       images des machines louées (demo_mode)        workers*
#    reverse_proxy       nginx HTTPS devant Gunicorn                    contrôleur
#    webapp              Flask/Gunicorn, Faucheur, watchdog, secrets     contrôleur
#  * sans worker dans l'inventaire, les images sont construites sur le
#    contrôleur et les conteneurs y tournent (mode mono-hôte).
#
#  Pré-requis : ansible-galaxy collection install -r requirements.yml
#  Lancement :  ansible-playbook site.yml --ask-vault-pass
# =============================================================================

- name: 1. Durcissement de tous les nœuds (UFW)
  hosts: insacloud
  become: true
  roles:
    - role: security_hardening
      tags: [security]

- name: 2. Contrôleur — compte de service et clé SSH de pilotage
  hosts: controllers
  become: true
  roles:
    - role: controller_key
      tags: [controller, workers]

- name: 3. Workers — Docker, certificat, accès du contrôleur, images
  hosts: workers
  become: true
  roles:
    - role: docker
      tags: [docker]
    - role: tls_cert
      tags: [tls]
    - role: worker
      tags: [workers]
    - role: docker_images
      tags: [images]

- name: 4. Contrôleur — client Docker, certificat, nginx, application
  hosts: controllers
  become: true
  vars:
    single_host: "{{ groups['workers'] | default([]) | length == 0 }}"
  roles:
    - role: docker
      docker_cli_only: "{{ not single_host }}"
      tags: [docker]
    - role: docker_images
      when: single_host
      tags: [images]
    - role: tls_cert
      tags: [tls]
    - role: reverse_proxy
      tags: [proxy]
    - role: webapp
      tags: [webapp]
