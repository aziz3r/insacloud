---
# =============================================================================
#  roles/webapp/defaults/main.yml - Variables par défaut du rôle webapp
# =============================================================================

# --- Emplacements sur le serveur ---------------------------------------------
insacloud_user: insacloud
insacloud_root: /opt/insacloud
insacloud_app_dir: "{{ insacloud_root }}/app"
insacloud_docker_dir: "{{ insacloud_root }}/docker"
insacloud_venv: "{{ insacloud_root }}/venv"
insacloud_env_file: /etc/insacloud/insacloud.env     # secrets, mode 0600 root

# --- Sources sur le poste de contrôle (relatives au dossier 3_ansible) --------
insacloud_src_webapp: "{{ playbook_dir }}/../2_webapp"
insacloud_src_docker: "{{ playbook_dir }}/../1_docker"

# --- Paramètres applicatifs (injectés en variables d'environnement) ---------
insacloud_web_port: 5000
insacloud_port_min: 8000
insacloud_port_max: 9000
insacloud_max_instances: 3
insacloud_max_duration: 120
insacloud_faucheur_interval: 10
insacloud_container_memory: 256m
insacloud_gui_memory: 1g            # machines "bureau graphique"

# --- Sauvegarde du travail avant la destruction d'une machine -----------------
# Le Faucheur archive /root et /home de la machine juste avant de la détruire ;
# l'utilisateur télécharge l'archive depuis son tableau de bord.
insacloud_archive_enabled: true
insacloud_archive_dir: /var/lib/insacloud/archives    # privé : copies des fichiers des utilisateurs
insacloud_archive_max_mb: 100                         # au-delà, l'archive est refusée
insacloud_archive_retention_days: 7                   # puis le Faucheur l'efface
insacloud_archive_timeout: 45                         # secondes ; doit rester sous insacloud_gunicorn_timeout
# --- Nœuds Docker (workers) : "worker1=IP,worker2=IP" ; vide = Docker local ------
# Calculé par le rôle depuis le groupe [workers] de l'inventaire (voir tasks).
insacloud_workers_env: ""
insacloud_docker_ssh_user: "{{ insacloud_user }}"

# Clés secrètes : DOIVENT être fournies par le Vault (group_vars/insacloud/vault.yml)
insacloud_secret_key: ""      # sessions Flask
insacloud_vault_key: ""       # chiffrement des mots de passe root (clé Fernet)

# --- Paquets Python -----------------------------------------------------------
webapp_system_packages:
  - python3
  - python3-pip
  - python3-venv
  - python3-setuptools
# Les dépendances ne sont plus listées ici : elles viennent de
# 2_webapp/requirements.txt, le fichier que la chaîne d'intégration audite.

# --- Sécurité : le site est servi en HTTPS par nginx (rôle reverse_proxy) ---
insacloud_https: true
insacloud_tls_dir: /etc/insacloud/tls     # certificat monté dans les machines louées

# --- Gunicorn ---------------------------------------------------------------
insacloud_gunicorn_workers: 4
insacloud_gunicorn_timeout: 60      # secondes ; `docker run` peut prendre quelques secondes

# --- Fichiers de l'application à copier (relatifs à 2_webapp/) ---------------
webapp_files:
  # Application et couches métier
  - app.py
  - api.py
  - archives.py
  - services.py
  - config.py
  - crypto.py
  - docker_ops.py
  - database.py
  - models.py
  - faucheur.py
  - workers.py
  - seed.py
  # Gabarits
  - templates/login.html
  - templates/dashboard.html

# --- Images Docker des machines louées (multi-OS) ---------------------------
# Le catalogue `insacloud_images`, la liste `demo_images` et l'interrupteur
# `demo_mode` sont définis dans group_vars/insacloud/vars.yml : les rôles
# `docker_images` (construction) et `webapp` (déclaration à l'application)
# doivent voir la même liste, une seule source de vérité l'y garantit.


# --- Services systemd ---------------------------------------------------------
# `exec` = commande ExecStart de l'unité systemd (template insacloud.service.j2)
insacloud_services:
  - name: insacloud-web
    description: "InsaCloud - Serveur web Flask (Gunicorn)"
    exec: >-
      {{ insacloud_venv }}/bin/gunicorn
      --workers {{ insacloud_gunicorn_workers }}
      --bind 127.0.0.1:{{ insacloud_web_port }}
      --timeout {{ insacloud_gunicorn_timeout }}
      --preload
      --access-logfile - --error-logfile -
      --chdir {{ insacloud_app_dir }}
      app:app
  - name: insacloud-faucheur
    description: "InsaCloud - Faucheur (destruction des machines expirées)"
    exec: "{{ insacloud_venv }}/bin/python {{ insacloud_app_dir }}/faucheur.py"
