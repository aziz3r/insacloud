---
# roles/worker : compte de pilotage + clé du contrôleur
- name: Vérifier que la clé publique du contrôleur est connue
  ansible.builtin.assert:
    that: insacloud_controller_pubkey | length > 0
    fail_msg: "Clé publique du contrôleur absente : le play 'Contrôleur : clé SSH' doit s'exécuter avant."
    quiet: true

- name: Créer l'utilisateur de pilotage {{ insacloud_user }} (groupe docker)
  ansible.builtin.user:
    name: "{{ insacloud_user }}"
    system: true
    shell: /bin/bash                 # requis par le transport SSH du client Docker
    home: "{{ insacloud_root }}"
    create_home: true
    groups: docker
    append: true

- name: "Autoriser la clé SSH du contrôleur (accès restreint : pas de mot de passe, pas d'agent)"
  ansible.posix.authorized_key:
    user: "{{ insacloud_user }}"
    key: "{{ insacloud_controller_pubkey }}"
    key_options: "no-agent-forwarding,no-X11-forwarding,no-port-forwarding"
    exclusive: true

- name: Limiter SSH à l'authentification par clé pour cet utilisateur
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} INSACLOUD WORKER"
    block: |
      Match User {{ insacloud_user }}
          PasswordAuthentication no
          AllowTcpForwarding no
          X11Forwarding no
    validate: "sshd -t -f %s"
  notify: Recharger sshd
