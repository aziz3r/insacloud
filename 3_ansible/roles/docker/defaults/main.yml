---
# =============================================================================
#  roles/docker/defaults/main.yml - Variables par défaut du rôle docker
#  (surchargeables depuis group_vars ou le playbook)
# =============================================================================

# Dépôt officiel Docker pour Ubuntu
docker_repo_url: "https://download.docker.com/linux/ubuntu"
docker_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_keyring: "/etc/apt/keyrings/docker.asc"

# Architecture APT déduite des facts : aarch64 -> arm64, sinon amd64
docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# Paquets pré-requis pour ajouter un dépôt APT signé
docker_prerequisites:
  - ca-certificates
  - curl
  - gnupg

# true : n'installer que le client (le contrôleur pilote les workers via `docker -H ssh://`)
docker_cli_only: false

# Paquets Docker à installer
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
docker_cli_packages:
  - docker-ce-cli

# Conservation de l'état : les conteneurs continuent de tourner pendant un
# redémarrage du démon Docker (mise à jour, crash) ; --restart=always les
# relance après un redémarrage de la machine.
docker_daemon_config:
  live-restore: true
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"

# Utilisateurs existants à ajouter au groupe docker (ex: [vagrant])
docker_users: []
