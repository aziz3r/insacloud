---
# =============================================================================
#  roles/docker/tasks/main.yml - Installation idempotente de Docker Engine
# -----------------------------------------------------------------------------
#  Chaque tâche décrit un ÉTAT désiré (présent, démarré, ...) : relancer le
#  rôle sur une machine déjà configurée ne change rien (0 "changed").
# =============================================================================

- name: Mettre à jour le cache APT (valide 1 h)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les pré-requis (certificats, curl, gnupg)
  ansible.builtin.apt:
    name: "{{ docker_prerequisites }}"
    state: present

- name: Créer le répertoire des clés APT
  ansible.builtin.file:
    path: "{{ docker_keyring | dirname }}"
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG du dépôt Docker
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_keyring }}"
    mode: "0644"

- name: Ajouter le dépôt APT officiel de Docker ({{ docker_arch }})
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch }} signed-by={{ docker_keyring }}]
      {{ docker_repo_url }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Installer le client Docker seul (nœud contrôleur)
  ansible.builtin.apt:
    name: "{{ docker_cli_packages }}"
    state: present
  when: docker_cli_only | bool

- name: Installer Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  when: not docker_cli_only | bool

- name: Configurer le démon Docker (live-restore, rotation des logs)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  when: not docker_cli_only | bool
  notify: Redémarrer docker

- name: Activer et démarrer le service Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: not docker_cli_only | bool

- name: Ajouter les utilisateurs au groupe docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: not docker_cli_only | bool

- name: Vérifier que le démon Docker répond
  ansible.builtin.command:
    cmd: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
  register: docker_info
  changed_when: false
  when: not docker_cli_only | bool

- name: Afficher la version de Docker installée
  ansible.builtin.debug:
    msg: "{{ 'Client Docker installé (pilotage des workers par SSH)' if docker_cli_only | bool else 'Docker Engine ' ~ docker_info.stdout ~ ' opérationnel (' ~ docker_arch ~ ')' }}"
