---
# =============================================================================
#  roles/docker_images - Construction des images des machines louées
#  Appliqué aux workers (ou au contrôleur s'il n'y a pas de worker).
# =============================================================================
insacloud_user: insacloud
insacloud_root: /opt/insacloud
insacloud_docker_dir: "{{ insacloud_root }}/docker"
insacloud_src_docker: "{{ playbook_dir }}/../1_docker"

# --- Mode démonstration : true = seule l'image Alpine (rapide) ; false = les 6 images
demo_mode: true

# insacloud_images et demo_images : définis dans group_vars/insacloud/vars.yml
# (partagés par les rôles docker_images et webapp).
