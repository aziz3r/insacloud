<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" role="img" aria-label="Cycle de vie d'une machine louée, de la demande à l'expiration, avec la reprise après panne d'un nœud">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/></marker><marker id="flA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3a008"/></marker></defs>
<rect width="900" height="416" rx="12" fill="#0d1117"/>
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Cycle de vie d'une machine louée</text>
<rect x="28" y="66" width="152" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="50" cy="90" r="11" fill="#2a1218" stroke="#ff6b81" stroke-width="1.2"/>
<text x="50" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">1</text>
<text x="70" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Choix</text>
<text x="44" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">distribution</text>
<text x="44" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">terminal ou bureau</text>
<text x="44" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">durée 1-120 min</text>
<path d="M 182 130 L 196 130" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="200" y="66" width="152" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="222" cy="90" r="11" fill="#2a1218" stroke="#ff6b81" stroke-width="1.2"/>
<text x="222" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">2</text>
<text x="242" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Placement</text>
<text x="216" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">nœud joignable</text>
<text x="216" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">le moins chargé</text>
<text x="216" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">ports libres</text>
<path d="M 354 130 L 368 130" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="372" y="66" width="152" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="394" cy="90" r="11" fill="#2a1218" stroke="#ff6b81" stroke-width="1.2"/>
<text x="394" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">3</text>
<text x="414" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Démarrage</text>
<text x="388" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">docker run -d</text>
<text x="388" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">--restart=always</text>
<text x="388" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">supervisord PID 1</text>
<path d="M 526 130 L 540 130" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="544" y="66" width="152" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="566" cy="90" r="11" fill="#2a1218" stroke="#ff6b81" stroke-width="1.2"/>
<text x="566" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">4</text>
<text x="586" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Accès</text>
<text x="560" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">SSH par clé ou</text>
<text x="560" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">mot de passe</text>
<text x="560" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">terminal · bureau</text>
<path d="M 698 130 L 712 130" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#fl)"/>
<rect x="716" y="66" width="152" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<circle cx="738" cy="90" r="11" fill="#2a1218" stroke="#ff6b81" stroke-width="1.2"/>
<text x="738" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">5</text>
<text x="758" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Expiration</text>
<text x="732" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">le Faucheur lance</text>
<text x="732" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">docker rm -f</text>
<text x="732" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#9aa4b1">+ réconciliation</text>
<rect x="200" y="226" width="472" height="76" rx="10" fill="#2b2213" stroke="#5c4a1f" stroke-width="1.5"/>
<text x="216" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e3a008">Si le nœud tombe pendant la location</text>
<text x="216" y="269" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#e3a008">plus de battement de cœur  →  nœud OFFLINE</text>
<text x="216" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#e3a008">→  machine recréée sur un nœud disponible  →  retour à l'étape 4</text>
<path d="M 620 198 L 620 222" fill="none" stroke="#e3a008" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#flA)"/>
<path d="M 240 226 L 240 210 L 560 210 L 560 198" fill="none" stroke="#e3a008" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#flA)"/>
<text x="688" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#e3a008">la location</text>
<text x="688" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#e3a008">n'est pas</text>
<text x="688" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#e3a008">interrompue</text>
<text x="28" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Tout au long du cycle</text>
<text x="28" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Mot de passe affiché une seule fois, puis conservé chiffré (Fernet) et réaffiché après re-authentification — jamais dans un cookie.</text>
<text x="28" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Un service qui tombe est relancé par supervisord ; un nœud qui redémarre retrouve ses machines et leurs données.</text>
<text x="28" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Un nœud perdu, en revanche, ne rend pas les fichiers : la machine repart neuve ailleurs, avec un nouveau port et un nouveau mot de passe.</text>
</svg>