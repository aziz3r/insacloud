<text x="698" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">un déploiement qui ne</text>
<text x="698" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">sert pas fait échouer</text>
