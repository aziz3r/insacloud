<text x="523" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#ff6b81" text-anchor="middle">Verrou — publication et déploiement n'ont lieu que si tout ce qui précède est au vert</text>
<path d="M 790 258 L 790 276" fill="none" stroke="#ff6b81" stroke-width="1.6" marker-end="url(#arrowA)"/>
<path d="M 256 324 L 256 354" fill="none" stroke="#ff6b81" stroke-width="1.6" marker-end="url(#arrowA)"/>
<text x="28" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Les deux derniers travaux ne s'exécutent que sur un envoi vers « main », et seulement si les neuf précédents sont au vert.</text>
<text x="28" y="571" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Le déploiement s'annonce ignoré, plutôt que de faire croire à un déploiement, si les secrets DEPLOY_* ou ANSIBLE_VAULT_PASSWORD manquent.</text>
<text x="28" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#9aa4b1">Chaque commande de la chaîne est rejouable telle quelle sur un poste : rien n'y est spécifique à l'agent d'intégration.</text>
</svg>