<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" role="img" aria-label="Modèle de données InsaCloud : six tables, dont Instance et Rental séparées pour permettre la reprise sur un autre nœud">
<rect width="900" height="684" rx="12" fill="#ffffff"/>
<text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="600" fill="#15171c">InsaCloud — modèle de données</text>
<text x="28" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#8b9098">Six tables. Instance décrit un conteneur, Rental l'engagement de location : les séparer permet de recréer la machine ailleurs sans toucher à la location.</text>
