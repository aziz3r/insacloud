<rect x="28" y="481" width="844" height="118" rx="10" fill="#f7f8fa" stroke="#d8dce2" stroke-width="1.5"/>
<text x="44" y="503" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="12" font-weight="600" fill="#15171c">Relations</text>
<text x="44" y="523" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#c8102e">users  1 — n  rentals</text>
<text x="236" y="523" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">un utilisateur loue plusieurs fois</text>
<text x="44" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#c8102e">rentals  1 — 1  instances</text>
<text x="236" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">la location survit au conteneur : c'est ce qui permet de recréer la machine ailleurs</text>
<text x="44" y="561" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#c8102e">instances  n — 1  workers</text>
<text x="236" y="561" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">une machine s'exécute sur un nœud à la fois</text>
<text x="44" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#c8102e">instances  n — 1  distributions</text>
<text x="236" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">le catalogue est en base, pas en dur</text>
<text x="28" y="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">Index unique partiel sur (worker_id, ssh_port), limité aux instances actives : un port redevient libre dès que la machine est détruite.</text>
<text x="28" y="644" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">Index (status, end_time) sur rentals : c'est exactement la requête que le Faucheur exécute toutes les dix secondes.</text>
<text x="28" y="661" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="10.5" fill="#5b616b">Schéma décrit en SQLAlchemy et versionné par Alembic · SQLite en mode WAL, ou PostgreSQL via DATABASE_URL.</text>
</svg>