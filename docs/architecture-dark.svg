<text x="430" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590" text-anchor="middle">SSH · terminal web · bureau (ports 8000-9000)</text>
<text x="18" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">Le contrôleur n'exécute aucune machine louée : il n'a que le client Docker. Chaque worker s'inscrit seul au démarrage, puis</text>
<text x="18" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11" fill="#7d8590">signale sa présence. Sans battement de cœur il passe hors ligne, et ses machines sont recréées sur un nœud disponible.</text>
